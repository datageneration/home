<svg viewBox="0 0 1000 420" width="1000" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Putnam's four causes of the decline of civil society" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hd{font:600 15px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 17px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:13.5px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.out{fill:#f3f7f4;stroke:#008542;stroke-width:2;rx:6}
</style>

<text class="hd" x="60" y="32">FOUR DRIVERS  —  PUTNAM</text>

<rect class="cell" x="60" y="48" width="212" height="166"/>
<text class="nm" x="80" y="78">1 · Women to work</text>
<text class="tx" x="80" y="106">Women had comprised the</text>
<text class="tx" x="80" y="126">bulk of voluntary membership.</text>
<text class="tn" x="80" y="158">Entry into the workforce cut</text>
<text class="tn" x="80" y="178">women’s civic participation —</text>
<text class="tn" x="80" y="198">and family participation too.</text>

<rect class="cell" x="288" y="48" width="212" height="166"/>
<text class="nm" x="308" y="78">2 · Mobility</text>
<text class="tx" x="308" y="106">Post-war transport ended</text>
<text class="tx" x="308" y="126">the one-neighbourhood life.</text>
<text class="tn" x="308" y="158">People no longer are born,</text>
<text class="tn" x="308" y="178">live and die in one place, so</text>
<text class="tn" x="308" y="198">community bonds dissolve.</text>

<rect class="cell" x="516" y="48" width="212" height="166"/>
<text class="nm" x="536" y="78">3 · Demography</text>
<text class="tx" x="536" y="106">Fewer marriages, more</text>
<text class="tx" x="536" y="126">divorces, and suburbia.</text>
<text class="tn" x="536" y="158">Movement from urban</text>
<text class="tn" x="536" y="178">neighbourhoods to impersonal</text>
<text class="tn" x="536" y="198">suburbs means less contact.</text>

<rect class="cell" x="744" y="48" width="196" height="166"/>
<text class="nm" x="764" y="78">4 · Private leisure</text>
<text class="tx" x="764" y="106">Television, video games,</text>
<text class="tx" x="764" y="126">DVDs, the internet.</text>
<text class="tn" x="764" y="158">Entertainment no longer</text>
<text class="tn" x="764" y="178">requires anyone else. One can</text>
<text class="tn" x="764" y="198">be completely alone.</text>

<path d="M 166 214 L 166 248" stroke="#5f6b6b" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M 394 214 L 420 248" stroke="#5f6b6b" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M 622 214 L 580 248" stroke="#5f6b6b" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M 842 214 L 760 248" stroke="#5f6b6b" stroke-width="1.5" marker-end="url(#a2)"/>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6b6b"/></marker></defs>

<rect class="out" x="60" y="254" width="880" height="62"/>
<text class="nm" x="84" y="282" fill="#008542">Fewer joiners — the bowling-league metaphor</text>
<text class="tx" x="84" y="304">Americans join far less than in Tocqueville’s time, and are becoming less trusting and more disengaged from politics.</text>

<text class="tn" x="60" y="352">The implication Putnam draws: declining civic engagement, and ultimately a decline in the health of democracy in the</text>
<text class="tn" x="60" y="374">developed world. Note that none of the four drivers is political — which is exactly the move the critics attack.</text>
</svg>
