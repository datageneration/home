<svg viewBox="0 0 1000 420" width="1000" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duverger's Law: the mechanical and psychological effects of plurality rules" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hd{font:600 14px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 18px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:12.5px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.out{fill:#f3f7f4;stroke:#008542;stroke-width:2;rx:6}
</style>
<text class="hd" x="60" y="32">PLURALITY, SINGLE-BALLOT, SINGLE-MEMBER DISTRICTS</text>

<rect class="cell" x="60" y="48" width="400" height="124"/>
<text class="nm" x="84" y="78">Mechanical effect</text>
<text class="tx" x="84" y="106">Third and fourth parties are systematically</text>
<text class="tx" x="84" y="126">under-represented in seats relative to votes.</text>
<text class="tn" x="84" y="154">UK 2005: Liberal Democrats won 22.1% of votes, 9.6% of 646 seats.</text>

<rect class="cell" x="500" y="48" width="440" height="124"/>
<text class="nm" x="524" y="78">Psychological effect</text>
<text class="tx" x="524" y="106">Seeing that, supporters of minor parties stop</text>
<text class="tx" x="524" y="126">“wasting” their vote and vote strategically instead.</text>
<text class="tn" x="524" y="154">They vote against their least preferred candidate rather than for their first choice.</text>

<path d="M 260 172 L 400 206" stroke="#008542" stroke-width="2" marker-end="url(#d1)"/>
<path d="M 720 172 L 600 206" stroke="#008542" stroke-width="2" marker-end="url(#d1)"/>
<defs><marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#008542"/></marker></defs>

<rect class="out" x="300" y="214" width="400" height="60"/>
<text class="nm" x="324" y="242" fill="#008542">Duverger's Law</text>
<text class="tx" x="324" y="264">Plurality rules tend toward a two-party system.</text>

<rect class="cell" x="60" y="294" width="400" height="98"/>
<text class="nm" x="84" y="322">The arithmetic behind it</text>
<text class="tx" x="84" y="348">A 34 · B 33 · C 33 — A takes the seat, 66% of votes</text>
<text class="tx" x="84" y="368">are wasted, so B and C have reason to merge.</text>

<rect class="cell" x="500" y="294" width="440" height="98"/>
<text class="nm" x="524" y="322">Under proportional rules</text>
<text class="tx" x="524" y="348">Same votes, three parties seated at 34, 33 and 33 per</text>
<text class="tx" x="524" y="368">cent. Nothing is wasted, so nothing pushes them to merge.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
