<svg viewBox="0 0 1000 440" width="1000" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two channels of democratic diffusion: regional proximity and cultural-linguistic affinity" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hd{font:600 14px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 18px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:12.5px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.node{fill:#f3f7f4;stroke:#008542;stroke-width:1.8;rx:6}
.warn{fill:#fdf0e3;stroke:#E87500;stroke-width:1.8;rx:6}
</style>

<text class="hd" x="60" y="30">ONE COUNTRY DEMOCRATIZES  —  AND SUPPLIES A MODEL FOR EMULATION</text>

<rect class="cell" x="60" y="44" width="430" height="150"/>
<text class="nm" x="84" y="74">Channel 1 · Regional proximity</text>
<text class="tx" x="84" y="102">Neighbouring states are typically oriented to the</text>
<text class="tx" x="84" y="122">same political-economic policies.</text>
<text class="tn" x="84" y="150">A “regional positive diffusion effect,” or a regional</text>
<text class="tn" x="84" y="168">learning curve — Shin 1994, pp. 152–153.</text>

<rect class="cell" x="510" y="44" width="430" height="150"/>
<text class="nm" x="534" y="74">Channel 2 · Cultural and linguistic ties</text>
<text class="tx" x="534" y="102">Demonstration effects may <tspan font-style="italic">transcend</tspan> regional</text>
<text class="tx" x="534" y="122">boundaries where countries share affinities.</text>
<text class="tn" x="534" y="150">Which is why diffusion is not simply a map of</text>
<text class="tn" x="534" y="168">who borders whom.</text>

<rect class="node" x="60" y="222" width="236" height="76"/>
<text class="nm" x="84" y="250" fill="#008542">Portugal · Spain</text>
<text class="tn" x="84" y="276">1974–75, the wave's first cases</text>

<path d="M 300 260 L 390 260" stroke="#008542" stroke-width="2.5" marker-end="url(#f1)"/>
<text class="hd" x="304" y="246" fill="#008542">LONGSTANDING</text>
<text class="hd" x="304" y="286" fill="#008542">CULTURAL AND POLITICAL TIES</text>
<defs><marker id="f1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#008542"/></marker></defs>

<rect class="node" x="610" y="222" width="330" height="76"/>
<text class="nm" x="634" y="250" fill="#008542">South and Central America</text>
<text class="tn" x="634" y="276">Brazil, then the Spanish-speaking states, late 1970s–80s</text>

<rect class="warn" x="60" y="324" width="880" height="86"/>
<text class="nm" x="84" y="352">What the evidence actually supports</text>
<text class="tx" x="84" y="378">Starr, and Modelski and Perry, detect demonstration effects — but neither considers internal factors, nor the</text>
<text class="tx" x="84" y="398">regional heterogeneity of the world system. Starr finds diffusion at a regional level for <tspan font-style="italic">some</tspan> of it, but not all.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
