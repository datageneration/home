<svg viewBox="0 0 1000 410" width="1000" height="410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The four choices that make up an electoral system" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hd{font:600 14px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 18px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:12.5px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.top{fill:#f3f7f4;stroke:#008542;stroke-width:1.5;rx:6}
</style>
<rect class="top" x="60" y="24" width="880" height="50"/>
<text class="hd" x="86" y="46">AN ELECTORAL SYSTEM IS A SET OF FOUR CHOICES</text>
<text class="tx" x="86" y="66">Who is to be elected, and how — the method by which voters make a choice between options</text>

<rect class="cell" x="60" y="94" width="212" height="208"/>
<text class="nm" x="80" y="124">1 · Formula</text>
<text class="tx" x="80" y="152">Plurality (FPTP)</text>
<text class="tn" x="80" y="172">Most votes wins, majority</text>
<text class="tn" x="80" y="190">not required</text>
<text class="tx" x="80" y="216">Majority</text>
<text class="tn" x="80" y="236">50% + 1, or a run-off</text>
<text class="tx" x="80" y="262">Proportional</text>
<text class="tn" x="80" y="282">Seat share tracks vote share</text>

<rect class="cell" x="288" y="94" width="212" height="208"/>
<text class="nm" x="308" y="124">2 · District magnitude</text>
<text class="tx" x="308" y="152">How many members are</text>
<text class="tx" x="308" y="172">elected from one district</text>
<text class="tn" x="308" y="204">Single-member — US, UK,</text>
<text class="tn" x="308" y="222">Canada, Ghana, India</text>
<text class="tn" x="308" y="248">Multimember — Belgium's 11</text>
<text class="tn" x="308" y="266">districts; the Netherlands</text>
<text class="tn" x="308" y="284">treats the whole country as one</text>

<rect class="cell" x="516" y="94" width="212" height="208"/>
<text class="nm" x="536" y="124">3 · Ballot structure</text>
<text class="tx" x="536" y="152">Categorical</text>
<text class="tn" x="536" y="172">One either/or choice; the</text>
<text class="tn" x="536" y="190">vote cannot be divided</text>
<text class="tx" x="536" y="216">Ordinal</text>
<text class="tn" x="536" y="236">Voters rank their preferences</text>
<text class="tn" x="536" y="254">— the single transferable</text>
<text class="tn" x="536" y="272">vote in Ireland and Malta</text>

<rect class="cell" x="744" y="94" width="196" height="208"/>
<text class="nm" x="764" y="124">4 · Thresholds</text>
<text class="tx" x="764" y="152">The minimum vote share</text>
<text class="tx" x="764" y="172">that qualifies a party for</text>
<text class="tx" x="764" y="192">any seats at all</text>
<text class="tn" x="764" y="224">Israel  2%</text>
<text class="tn" x="764" y="246">Germany, Belgium  5%</text>
<text class="tn" x="764" y="268">Turkey  10%</text>

<text class="tn" x="60" y="336">Plurality systems typically combine a winner-take-all formula, small district magnitude and categorical ballots.</text>
<text class="tn" x="60" y="358">PR systems combine proportional formulae, large district magnitude, and categorical — occasionally ordinal — ballots.</text>
<text class="tn" x="60" y="386">Thresholds are an increasingly common way for PR systems to limit the entry of minor, and sometimes extremist, parties.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
