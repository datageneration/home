<svg viewBox="0 0 1000 430" width="1000" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Families of electoral system, including closed and open party lists and the two kinds of mixed system" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hd{font:600 14px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 18px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:13.5px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:12.5px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.sub{fill:#f7f9f8;stroke:#d8d8d0;stroke-width:1.2;rx:5}
</style>
<rect class="cell" x="60" y="30" width="276" height="178"/>
<text class="nm" x="84" y="60">Plurality / majority</text>
<text class="tx" x="84" y="88">FPTP — most votes wins</text>
<text class="tn" x="84" y="110">US, UK, Canada, Ghana, India</text>
<text class="tx" x="84" y="138">Two-round majority</text>
<text class="tn" x="84" y="160">France, Russia, Poland, Argentina</text>
<text class="tx" x="84" y="186">Block vote — multimember plurality</text>

<rect class="cell" x="362" y="30" width="276" height="178"/>
<text class="nm" x="386" y="60">List PR</text>
<text class="tx" x="386" y="88">Seat share tracks vote share in</text>
<text class="tx" x="386" y="108">multimember districts</text>
<text class="tn" x="386" y="136">Netherlands, Belgium, Israel, South</text>
<text class="tn" x="386" y="154">Africa, Iraq, Poland, Czech Republic</text>
<text class="tn" x="386" y="186">Single transferable vote is a PR variant — Ireland, 3–5 seats</text>

<rect class="cell" x="664" y="30" width="276" height="178"/>
<text class="nm" x="688" y="60">Mixed</text>
<text class="tx" x="688" y="88">Two votes: one for a candidate,</text>
<text class="tx" x="688" y="108">one for a party</text>
<text class="tx" x="688" y="138">Additional member — the two</text>
<text class="tn" x="688" y="158">halves are linked. Germany, NZ</text>
<text class="tx" x="688" y="184">Parallel — unlinked. Russia 1993–2007, Japan</text>

<rect class="sub" x="60" y="232" width="440" height="128"/>
<text class="nm" x="84" y="262">Closed list</text>
<text class="tx" x="84" y="290">Voters vote only for a party list.</text>
<text class="tx" x="84" y="312">The party decides who is on it, and in what order.</text>
<text class="tn" x="84" y="342">Order decides who is seated — so this puts considerable power in the party leadership.</text>

<rect class="sub" x="524" y="232" width="416" height="128"/>
<text class="nm" x="548" y="262">Open list</text>
<text class="tx" x="548" y="290">Voters may back the list as a whole, or choose</text>
<text class="tx" x="548" y="312">individual candidates regardless of their ranking.</text>
<text class="tn" x="548" y="342">A “preference vote.” More room for voter input, and touted as the more democratic of the two.</text>

<text class="tn" x="60" y="394">Germany's additional-member system has two thresholds: a party needs three district seats <tspan font-style="italic">or</tspan> 5 per cent of the list vote.</text>
<text class="tn" x="60" y="416">New Zealand adopted its mixed system by referendum in 1993; before the change two parties dominated, after it seven won seats.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
