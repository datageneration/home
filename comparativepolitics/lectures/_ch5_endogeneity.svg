<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The endogeneity problem: did civil society cause democracy, or did democracy produce civil society?" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hd{font:600 15px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 19px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14.5px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.node{fill:#fff;stroke:#008542;stroke-width:2;rx:8}
.warn{fill:#fdf0e3;stroke:#E87500;stroke-width:2;rx:6}
</style>

<rect class="node" x="90" y="92" width="290" height="92"/>
<text class="nm" x="114" y="128">Civil society</text>
<text class="tn" x="114" y="156">Dense associational networks,</text>
<text class="tn" x="114" y="174">social capital, trust</text>

<rect class="node" x="620" y="92" width="290" height="92"/>
<text class="nm" x="644" y="128">Democracy</text>
<text class="tn" x="644" y="156">Responsive institutions and</text>
<text class="tn" x="644" y="174">a strong state</text>

<path d="M 385 118 L 612 118" stroke="#008542" stroke-width="2.5" marker-end="url(#e1)"/>
<text class="hd" x="414" y="106" fill="#008542">TOCQUEVILLE, PUTNAM:  CIVIL SOCIETY BUILDS IT</text>
<path d="M 612 162 L 385 162" stroke="#b23b22" stroke-width="2.5" marker-end="url(#e2)"/>
<text class="hd" x="404" y="188" fill="#b23b22">FOLEY AND EDWARDS:  OR IS IT THE OTHER WAY?</text>
<defs>
<marker id="e1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#008542"/></marker>
<marker id="e2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b23b22"/></marker>
</defs>

<text class="tx" x="90" y="238">“The strength and responsiveness of a democracy may depend on the character of civil society, as Putnam argues …</text>
<text class="tx" x="90" y="260">But such effects depend on the <tspan font-weight="bold">prior achievement of both democracy and a strong state</tspan>.”</text>
<text class="tn" x="90" y="282">Foley and Edwards 1996, p. 281</text>

<rect class="warn" x="90" y="302" width="820" height="72"/>
<text class="nm" x="114" y="330">Why this is more than academic</text>
<text class="tx" x="114" y="356">Unless the direction is settled, it is hard to say civil society causes anything — which calls into question every civil-society-building programme, USAID’s included.</text>
</svg>
