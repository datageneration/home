<svg viewBox="0 0 1000 430" width="1000" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Society at large, civil society, and political society: what the concept of civil society includes and excludes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hd{font:600 15px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 19px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.mid{fill:#f3f7f4;stroke:#008542;stroke-width:2;rx:6}
.x{font:600 15px 'Trebuchet MS',sans-serif;fill:#b23b22}
.ok{font:600 15px 'Trebuchet MS',sans-serif;fill:#008542}
</style>

<text class="hd" x="60" y="34">PRIVATE  ·  OUTSIDE THE STATE</text>
<text class="hd" x="368" y="34">VOLUNTARY  ·  PUBLIC-FACING</text>
<text class="hd" x="700" y="34">ATTACHED TO THE STATE</text>

<rect class="cell" x="60" y="50" width="276" height="300"/>
<text class="nm" x="84" y="84">Society at large</text>
<text class="tn" x="84" y="110">Excluded from the concept</text>
<text class="x" x="84" y="150">✕  Family life</text>
<text class="x" x="84" y="180">✕  Inward-looking group activity</text>
<text class="x" x="84" y="210">✕  The profit-making enterprise</text>
<text class="x" x="104" y="232">of individual business firms</text>
<text class="tn" x="84" y="272">All three pursue</text>
<text class="tn" x="84" y="292">private gain, or look inward.</text>

<rect class="mid" x="362" y="50" width="276" height="300"/>
<text class="nm" x="386" y="84" fill="#008542">Civil society</text>
<text class="tn" x="386" y="110">The concept</text>
<text class="ok" x="386" y="150">✓  Trade unions</text>
<text class="ok" x="386" y="180">✓  Professional associations</text>
<text class="ok" x="386" y="210">✓  Advocacy and rights groups</text>
<text class="ok" x="386" y="240">✓  Community organizations</text>
<text class="tx" x="386" y="282">Voluntary, autonomous from</text>
<text class="tx" x="386" y="302">the state, pursuing public goods.</text>
<text class="tx" x="386" y="330">It does not seek office.</text>

<rect class="cell" x="664" y="50" width="276" height="300"/>
<text class="nm" x="688" y="84">Political society</text>
<text class="tn" x="688" y="110">Also excluded</text>
<text class="x" x="688" y="150">✕  Congress</text>
<text class="x" x="688" y="180">✕  The bureaucracy</text>
<text class="x" x="688" y="210">✕  Political parties</text>
<text class="tn" x="688" y="252">Civil society shapes</text>
<text class="tn" x="688" y="272">political society — and is</text>
<text class="tn" x="688" y="292">conceptually distinct from it.</text>

<path d="M 638 200 L 660 200" stroke="#008542" stroke-width="2" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008542"/></marker></defs>

<text class="tn" x="60" y="392">Diamond: civil society is “an intermediary entity, standing between the private sphere and the state.”</text>
<text class="tn" x="60" y="414">Everything to its left pursues private gain; everything to its right is part of the state, or seeks to become it.</text>
</svg>
