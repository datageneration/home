<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three issues Chapter 5 limits itself to: feudalism, inequality, and civil society" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hd{font:600 15px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 20px 'Trebuchet MS',sans-serif;fill:#E87500}
.num{font:600 34px 'Trebuchet MS',sans-serif;fill:#008542;opacity:.3}
.tx{font:15px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.spine{fill:#f3f7f4;stroke:#008542;stroke-width:1.5;rx:6}
</style>

<rect class="spine" x="60" y="26" width="880" height="54"/>
<text class="hd" x="86" y="49">SOCIAL STRUCTURE</text>
<text class="tx" x="86" y="70">“the way in which society is organized” — hierarchical, as in caste systems, or egalitarian</text>

<line x1="500" y1="80" x2="500" y2="110" stroke="#008542" stroke-width="1.5"/>
<text class="hd" x="310" y="104">THE CHAPTER LIMITS ITSELF TO THREE ISSUES</text>

<rect class="cell" x="60" y="124" width="280" height="244"/>
<text class="num" x="296" y="166">1</text>
<text class="nm" x="84" y="160">Feudalism</text>
<text class="tx" x="84" y="194">Does a feudal past help</text>
<text class="tx" x="84" y="216">democracy, or block it?</text>
<text class="tn" x="84" y="252">Moore: the English lords</text>
<text class="tn" x="84" y="272">commercialized, and became</text>
<text class="tn" x="84" y="292">a bourgeoisie.</text>
<text class="tn" x="84" y="320">Tocqueville: the US had no</text>
<text class="tn" x="84" y="340">feudal hierarchy to escape.</text>

<rect class="cell" x="360" y="124" width="280" height="244"/>
<text class="num" x="596" y="166">2</text>
<text class="nm" x="384" y="160">Inequality</text>
<text class="tx" x="384" y="194">Do gaps between rich and</text>
<text class="tx" x="384" y="216">poor undermine democracy?</text>
<text class="tn" x="384" y="252">Aristotle, Mill, Lipset: a large</text>
<text class="tn" x="384" y="272">middle class sustains it.</text>
<text class="tn" x="384" y="300">Dahl: concentrated wealth</text>
<text class="tn" x="384" y="320">blocks reform from above and</text>
<text class="tn" x="384" y="340">breeds resentment below.</text>

<rect class="cell" x="660" y="124" width="280" height="244"/>
<text class="num" x="896" y="166">3</text>
<text class="nm" x="684" y="160">Civil society</text>
<text class="tx" x="684" y="194">Does associational life build</text>
<text class="tx" x="684" y="216">democracy — or follow it?</text>
<text class="tn" x="684" y="252">Tocqueville, Almond and Verba,</text>
<text class="tn" x="684" y="272">Putnam: it builds it.</text>
<text class="tn" x="684" y="300">Foley and Edwards: the effects</text>
<text class="tn" x="684" y="320">depend on democracy and a</text>
<text class="tn" x="684" y="340">strong state already existing.</text>
</svg>
