<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two rival prescriptions for divided societies: Lijphart's list PR and Horowitz's alternative vote" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.hd{font:600 14px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 18px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:13.5px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:12.5px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.q{fill:#f3f7f4;stroke:#008542;stroke-width:1.5;rx:6}
</style>
<rect class="q" x="200" y="24" width="600" height="48"/>
<text class="tx" x="226" y="54">Which electoral system best promotes accommodation in an ethnically divided society?</text>

<rect class="cell" x="60" y="96" width="420" height="214"/>
<text class="nm" x="84" y="126">Lijphart — list PR</text>
<text class="tx" x="84" y="154">Represent groups broadly and you integrate as</text>
<text class="tx" x="84" y="174">many subcultures as possible into the game.</text>
<text class="tn" x="84" y="204">Securing representation leads groups to moderate their demands.</text>
<text class="tn" x="84" y="228">Cohen: more accessible institutions produce “more frequent but</text>
<text class="tn" x="84" y="246">less intense” conflict.</text>
<text class="tn" x="84" y="278">The consociational position.</text>

<rect class="cell" x="520" y="96" width="420" height="214"/>
<text class="nm" x="544" y="126">Horowitz — the alternative vote</text>
<text class="tx" x="544" y="154">A single-member district with an ordinal ballot.</text>
<text class="tx" x="544" y="174">No majority? Drop the last candidate and</text>
<text class="tx" x="544" y="194">redistribute their second preferences.</text>
<text class="tn" x="544" y="224">Parties must court second preferences from <tspan font-style="italic">other</tspan> groups, so they</text>
<text class="tn" x="544" y="242">have reason to look acceptable as a second choice.</text>
<text class="tn" x="544" y="278">“Make moderation rewarding and penalize extremism.”</text>

<text class="tn" x="60" y="346">Horowitz also objects that list PR “freezes” ethnic cleavages and breeds ethnic parties, which he views as inimical to democracy.</text>
<text class="tn" x="60" y="372">Fraenkel and Grofman, studying the alternative vote in Fiji, argue list PR would have promoted accommodation more effectively.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
