<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a claim-evidence map">
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5f6b6b"/></marker>
<marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b03030"/></marker>
</defs>
<style>
.bx{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.lbl{font:600 13px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.tx{font:15px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.ln{stroke:#5f6b6b;stroke-width:1.6;fill:none}
.lnr{stroke:#b03030;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
</style>

<rect class="bx" x="20" y="20" width="230" height="66" style="fill:#f3f7f4;stroke:#008542"/>
<text class="lbl" x="34" y="43" fill="#008542">QUESTION</text>
<text class="tx" x="34" y="66">What are we trying to explain?</text>

<rect class="bx" x="330" y="20" width="300" height="66" style="fill:#fdf4ec;stroke:#E87500"/>
<text class="lbl" x="344" y="43" fill="#E87500">CLAIM</text>
<text class="tx" x="344" y="66">One sentence. Contestable.</text>

<rect class="bx" x="700" y="20" width="280" height="66"/>
<text class="lbl" x="714" y="43">QUALIFIER</text>
<text class="tx" x="714" y="66">How strongly? <tspan class="tn">usually · in this case</tspan></text>

<path class="ln" d="M250 53 H322" marker-end="url(#ar)"/>
<path class="ln" d="M630 53 H692" marker-end="url(#ar)"/>

<rect class="bx" x="330" y="150" width="300" height="62" style="fill:#f7f7f4"/>
<text class="lbl" x="344" y="173">WARRANT</text>
<text class="tx" x="344" y="196">Why does this evidence bear on that claim?</text>
<path class="ln" d="M480 150 V96" marker-end="url(#ar)"/>

<rect class="bx" x="30" y="280" width="280" height="92"/>
<text class="lbl" x="44" y="303">EVIDENCE 1</text>
<text class="tn" x="44" y="326">value · year · source · caveat</text>
<text class="tn" x="44" y="348">↳ which test does it pass?</text>

<rect class="bx" x="345" y="280" width="270" height="92"/>
<text class="lbl" x="359" y="303">EVIDENCE 2</text>
<text class="tn" x="359" y="326">value · year · source · caveat</text>
<text class="tn" x="359" y="348">↳ which test does it pass?</text>

<rect class="bx" x="650" y="280" width="270" height="92"/>
<text class="lbl" x="664" y="303">EVIDENCE 3</text>
<text class="tn" x="664" y="326">value · year · source · caveat</text>
<text class="tn" x="664" y="348">↳ which test does it pass?</text>

<path class="ln" d="M170 280 V240 H480 V218" marker-end="url(#ar)"/>
<path class="ln" d="M480 280 V218" marker-end="url(#ar)"/>
<path class="ln" d="M785 280 V240 H480" />

<rect class="bx" x="30" y="405" width="440" height="50" style="stroke:#b03030;fill:#fdf3f3"/>
<text class="lbl" x="44" y="427" fill="#b03030">COUNTER-EVIDENCE</text>
<text class="tn" x="44" y="446">What cuts against the claim — and how much?</text>

<rect class="bx" x="510" y="405" width="440" height="50" style="stroke:#b03030;fill:#fdf3f3"/>
<text class="lbl" x="524" y="427" fill="#b03030">REBUTTAL / RIVAL EXPLANATION</text>
<text class="tn" x="524" y="446">The account you rejected, and why</text>

<path class="lnr" d="M250 405 V392 H318 V181 H322" marker-end="url(#arR)"/>
<path class="lnr" d="M730 405 V392 H642 V181 H638" marker-end="url(#arR)"/>
</svg>
