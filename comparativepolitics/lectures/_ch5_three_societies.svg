<svg viewBox="0 0 1000 440" width="1000" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Civil Society I, II and III, and the contradiction between the first two" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.hd{font:600 15px 'Trebuchet MS',sans-serif;fill:#5f6b6b;letter-spacing:.06em}
.nm{font:600 19px 'Trebuchet MS',sans-serif;fill:#E87500}
.tx{font:14px Palatino,Georgia,serif;fill:#1c1c1c}
.tn{font:13px Palatino,Georgia,serif;fill:#5f6b6b}
.cell{fill:#fff;stroke:#d8d8d0;stroke-width:1.5;rx:6}
.warn{fill:#fdf0e3;stroke:#E87500;stroke-width:2;rx:6}
.st{fill:#eef2f0;stroke:#5f6b6b;stroke-width:1.5;rx:6}
</style>

<rect class="st" x="430" y="30" width="140" height="48"/>
<text class="hd" x="476" y="60">THE STATE</text>

<rect class="cell" x="60" y="110" width="400" height="150"/>
<text class="nm" x="84" y="142">Civil Society I  ·  Foley and Edwards</text>
<text class="tx" x="84" y="172">Associational life fosters patterns of civility.</text>
<text class="tx" x="84" y="194">A socializing and educating force promoting</text>
<text class="tx" x="84" y="216">tolerance and cooperation.</text>
<text class="tn" x="84" y="244">Needs to be close to governance — it creates a “good citizenry.”</text>

<rect class="cell" x="540" y="110" width="400" height="150"/>
<text class="nm" x="564" y="142">Civil Society II  ·  Foley and Edwards</text>
<text class="tx" x="564" y="172">A counterweight to the state — independent</text>
<text class="tx" x="564" y="194">by definition, promoting accountability</text>
<text class="tx" x="564" y="216">and checking tyranny.</text>
<text class="tn" x="564" y="244">Needs to be separate from the state — that is what makes it a check.</text>

<path d="M 306 112 L 438 84" stroke="#008542" stroke-width="2.5" marker-end="url(#a3)"/>
<text class="hd" x="316" y="74" fill="#008542">WORKS WITH IT</text>
<path d="M 694 112 L 562 84" stroke="#b23b22" stroke-width="2.5" marker-end="url(#a3b)"/>
<text class="hd" x="604" y="74" fill="#b23b22">CHECKS IT</text>
<defs>
<marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#008542"/></marker>
<marker id="a3b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b23b22"/></marker>
</defs>

<rect class="warn" x="230" y="282" width="540" height="58"/>
<text class="tx" x="254" y="308">The contradiction: I wants civil society <tspan font-weight="bold">close to</tspan> the state to socialize good citizens;</text>
<text class="tx" x="254" y="330">II wants it <tspan font-weight="bold">apart from</tspan> the state to check tyranny. It cannot be defined as both at once.</text>

<rect class="cell" x="60" y="358" width="880" height="62"/>
<text class="nm" x="84" y="386">Civil Society III  ·  Booth and Richard</text>
<text class="tx" x="84" y="408">Associations that do <tspan font-weight="bold">not</tspan> promote democracy — revolutionary, separatist, centrifugal, divisive in weak or deeply divided systems.</text>
</svg>
